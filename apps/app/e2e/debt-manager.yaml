appId: com.odin.finances
---
- launchApp
- tapOn: "Debt Manager"
- tapOn: "Create debt"
- tapOn: "Debt name"
- inputText: "Maestro debt"
- tapOn: "Current balance (PHP)"
- inputText: "1000"
- tapOn: "Minimum payment (PHP)"
- inputText: "100"
- tapOn: "Save debt"
- assertVisible: "Maestro debt"
- tapOn: "Create debt"
- tapOn: "Debt name"
- inputText: "Second debt"
- tapOn: "Current balance (PHP)"
- inputText: "500"
- tapOn: "Minimum payment (PHP)"
- inputText: "50"
- tapOn: "Save debt"
- assertVisible: "Second debt"
- tapOn: "Prioritize"
- tapOn: "Record payment"
- assertVisible: "Debt payment"
- tapOn: "Payment amount"
- inputText: "100"
- tapOn: "Select account"
- tapOn: "BPI Savings"
- tapOn: "Save"
- assertVisible: "Debt Manager"
- back
- assertVisible: "Maestro debt"
- tapOn: "Delete"
- assertVisible: "Delete this debt? Payment history remains locally readable."
- tapOn: "Cancel"
- assertVisible: "Maestro debt"
